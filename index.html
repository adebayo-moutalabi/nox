<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nox</title>
<link rel="stylesheet" href="design-tokens.css">
<style>
  /* Toutes les valeurs visuelles viennent de design-tokens.css */
  * { box-sizing:border-box; margin:0; padding:0; font-family:var(--font-text); }
  html, body { background:transparent; overflow:hidden; height:100%; user-select:none; }
  #app { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:6px; }
  :focus-visible { outline:none; box-shadow:var(--focus-ring); }

  /* Bulle (verre) */
  #bubble { max-width:280px; max-height:130px; overflow-y:auto; background:var(--surface); color:var(--ink);
    -webkit-backdrop-filter:blur(var(--blur)); backdrop-filter:blur(var(--blur));
    border:1px solid var(--line); border-radius:var(--radius-lg); padding:10px 13px; font-size:var(--text-md); line-height:1.45;
    box-shadow:var(--shadow-soft); margin-bottom:8px; position:relative; opacity:0; transform:translateY(6px) scale(.98);
    transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-spring); pointer-events:none; }
  #bubble.show { opacity:1; transform:none; pointer-events:auto; }
  #bubble .step { display:block; margin-top:6px; font-size:var(--text-sm); font-weight:600; color:var(--step-ink); }

  /* Carte de question : une question a la fois, grosses pastilles */
  #bubble.card { max-height:none; overflow:visible; width:280px; padding:14px; }
  #bubble .q { font-family:var(--font-title); font-weight:800; font-size:var(--text-lg); line-height:1.25; margin-bottom:10px; }
  #bubble .pills { display:flex; flex-wrap:wrap; gap:6px; }
  #bubble .pill { border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:var(--radius-pill);
    padding:6px 11px; font-size:12px; font-weight:600; cursor:pointer; }
  #bubble .pill:hover { border-color:var(--nox-blue); }
  #bubble .pill.on, #bubble .pills .pill:first-child:last-child { background:var(--nox-yellow); color:var(--on-accent); border-color:transparent; }
  #bubble .answer { display:flex; gap:6px; margin-bottom:6px; }
  #bubble .answer input { flex:1; min-width:0; border:1px solid var(--line); background:var(--surface-solid); color:var(--ink);
    border-radius:var(--radius-pill); padding:7px 12px; font-size:var(--text-md); outline:none; }
  #bubble .skip { display:block; margin:8px 0 0 auto; background:none; border:0; color:var(--ink-soft); font-size:var(--text-xs); cursor:pointer; text-decoration:underline; }
  #bubble .dots-progress { display:flex; gap:4px; margin-bottom:8px; }
  #bubble .dots-progress i { width:18px; height:4px; border-radius:2px; background:var(--line); }
  #bubble .dots-progress i.on { background:var(--nox-blue); }

  /* Mascotte */
  #stage { position:relative; width:130px; height:130px; cursor:grab; touch-action:none; }
  .drag #stage { cursor:grabbing; }
  #ring { position:absolute; inset:0; transform:rotate(-90deg); }
  #ring circle { fill:none; stroke-width:5; }
  #ring .track { stroke:var(--ring-track); }
  #ring .bar { stroke:var(--nox-blue); stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  #timerLabel { position:absolute; top:-2px; right:-4px; background:var(--bar-bg); color:var(--bar-fg); font-size:var(--text-xs);
    font-family:var(--font-title); font-weight:800; padding:2px 7px; border-radius:var(--radius-pill); display:none; font-variant-numeric:tabular-nums; }
  #mascot, #custom { position:absolute; left:10px; top:8px; width:110px; height:110px; overflow:visible; }

  /* Couleurs lumineuses selon l'humeur */
  #app { --glow:var(--glow-focus); }
  #app.happy { --glow:var(--glow-happy); } #app.proud { --glow:var(--glow-proud); } #app.worried { --glow:var(--glow-worried); } #app.idle { --glow:var(--glow-idle); }
  #mascot .eye { fill:var(--glow); transition:fill var(--dur-slow); }
  #mascot .eye-line { fill:none; stroke:var(--glow); stroke-width:2.6; stroke-linecap:round; transition:stroke var(--dur-slow); }
  #mascot .eye-line.thin { stroke-width:1.8; }
  #mascot .led, #mascot .core { fill:var(--glow); transition:fill var(--dur-slow); }
  #mascot .spark { fill:var(--nox-yellow); }
  #mascot .shadow { fill:var(--ground-shadow); opacity:.18; animation:shadow 2.6s ease-in-out infinite; transform-origin:50px 95px; }
  #mascot .float { animation:bob 2.6s ease-in-out infinite; }
  #mascot .hand.l { animation:bob 2.6s ease-in-out .3s infinite; }
  #mascot .hand.r { animation:bob 2.6s ease-in-out .6s infinite; }
  #mascot .led { animation:blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.45; } }
  @keyframes shadow { 50% { transform:scaleX(.8); opacity:.1; } }
  .idle #mascot .float { animation-duration:4.5s; }

  .worried #mascot { animation:shake .5s ease-in-out 3; }
  .proud #mascot, .happy #mascot { animation:hop .6s ease-in-out 2; }
  @keyframes bob { 50% { transform:translateY(-4px); } }
  @keyframes hop { 50% { transform:translateY(-12px); } }
  @keyframes shake { 25% { transform:translateX(-3px); } 75% { transform:translateX(3px); } }
  #mascot g.face { display:none; }
  .idle g.f-idle, .happy g.f-happy, .focus g.f-focus, .worried g.f-worried, .proud g.f-proud { display:inline !important; }
  /* Survol : elle sourit (sauf quand elle dort) */
  #app.hover:not(.idle) g.face { display:none !important; }
  #app.hover:not(.idle) g.f-happy { display:inline !important; }

  /* Couches animees (pilotees par renderer.js) */
  #mascot .body { transform-box:view-box; transform-origin:50px 93px; transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
  .drag #mascot .body { transform:scale(1.06,.94); }
  .squash #mascot .body { transform:scale(1.12,.86); transition-duration:.12s; }
  .stretch #mascot .body { transform:scale(.95,1.09); transition-duration:.45s; }
  .jump #mascot .body { animation:jump .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes jump { 0% { transform:scale(1.12,.88); } 40% { transform:translateY(-12px) scale(.94,1.08); } 100% { transform:none; } }
  .enter #stage { animation:land 1s cubic-bezier(.34,1.3,.64,1); }
  @keyframes land { 0% { transform:translateY(-240px); opacity:0; } 55% { transform:translateY(0) scale(1.14,.84); opacity:1; } 75% { transform:scale(.95,1.06); } 100% { transform:none; } }
  #mascot .eyes { transform-box:view-box; transform-origin:50px 49px; transition:transform .07s; }
  .blink #mascot .eyes { transform:scaleY(.1); }
  .yawn #mascot .eyes { transform:scaleY(.35); transition-duration:.3s; }
  #mascot .antenna { transform-box:view-box; transform-origin:50px 30px; }
  .wiggle #mascot .antenna { animation:wiggle .9s ease-in-out; }
  @keyframes wiggle { 20% { transform:rotate(-14deg); } 45% { transform:rotate(11deg); } 70% { transform:rotate(-6deg); } }

  /* Bouche : sourire au repos, ouverture selon le volume quand elle parle */
  #mascot .mouth-o { display:none; }
  .worried #mascot .mouth .smile { display:none; } .worried #mascot .mouth-o { display:inline; }
  .idle #mascot .mouth .smile { display:none; }
  #app.talking #mascot .mouth .smile, #app.talking #mascot .mouth-o { display:none; }

  /* Activites : ecoute (ondes), reflexion (points), parole */
  #mascot .wave { fill:none; stroke:var(--glow); stroke-width:1; opacity:0; transform-box:fill-box; transform-origin:center; }
  [data-act="listening"] #mascot .wave { animation:wave 1.3s ease-out infinite; }
  [data-act="listening"] #mascot .wave.w2 { animation-delay:.65s; }
  [data-act="listening"] #mascot .led { animation:blink .5s ease-in-out infinite; }
  @keyframes wave { from { transform:scale(.6); opacity:.9; } to { transform:scale(2); opacity:0; } }
  #mascot .dots { display:none; }
  [data-act="thinking"] #mascot .dots { display:inline; }
  #mascot .dots circle { animation:dot 1.2s ease-in-out infinite; }
  #mascot .dots circle:nth-child(2) { animation-delay:.2s; } #mascot .dots circle:nth-child(3) { animation-delay:.4s; }
  @keyframes dot { 0%, 100% { opacity:.2; } 50% { opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    #mascot *, #mascot, #stage, #zz { animation:none !important; transition:none !important; }
  }
  #zz { position:absolute; right:8px; top:4px; font-family:var(--font-title); font-size:13px; font-weight:800; color:var(--zz); display:none; }
  .idle #zz { display:block; animation:bob 2s infinite; }

  /* Micro-interactions : chaque bouton s'enfonce un peu, puis revient en ressort */
  button { font-family:inherit; transition:transform var(--dur-fast) var(--ease-spring), background var(--dur-fast); }
  button:active { transform:scale(var(--press-scale)); }

  /* Barre d'actions */
  #bar { display:flex; gap:6px; align-items:center; background:var(--bar-bg); border-radius:var(--radius-pill); padding:5px 6px; margin-top:4px;
    box-shadow:var(--shadow-soft); }
  #bar button { background:transparent; border:0; color:var(--bar-fg); width:30px; height:30px;
    border-radius:50%; cursor:pointer; font-size:15px; display:grid; place-items:center; }
  #bar button:hover { background:var(--bar-hover); }
  #bar .ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #voice .wave-off { display:none; } #voice.muted .wave-on { display:none; } #voice.muted .wave-off { display:inline; }
  /* Micro actif : couleur + pulsation (l'info ne passe pas que par la couleur) */
  #mic.rec { background:var(--danger); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px var(--danger-halo); } }
  #input { display:none; width:200px; border:0; outline:0; border-radius:var(--radius-pill);
    padding:6px 12px; font-size:var(--text-md); background:var(--surface-solid); color:var(--ink); }
  #bar.typing #input { display:block; }

  /* Panneaux (verre) */
  .panel { position:absolute; inset:8px 8px 60px 8px; background:var(--surface); border:1px solid var(--line);
    -webkit-backdrop-filter:blur(var(--blur)); backdrop-filter:blur(var(--blur));
    border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); padding:14px; font-size:var(--text-sm); color:var(--ink);
    display:none; flex-direction:column; gap:9px; z-index:5; overflow-y:auto; }
  .panel.show { display:flex; animation:pop var(--dur-base) var(--ease-spring); }
  @keyframes pop { from { opacity:0; transform:scale(.96); } }
  .panel h2 { font-family:var(--font-title); font-size:var(--text-lg); font-weight:800; }
  .panel p { color:var(--ink-soft); line-height:1.45; }
  .panel b { color:var(--ink); }
  .panel label { display:flex; gap:6px; align-items:flex-start; }
  .panel select, .panel input:not([type]) { width:100%; padding:5px 8px; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:var(--text-sm); }
  .panel input[type="checkbox"] { accent-color:var(--nox-blue); margin-top:2px; }
  .panel .go { margin-top:auto; background:var(--nox-yellow); color:var(--on-accent); font-family:var(--font-title); font-weight:800;
    font-size:var(--text-md); border:0; border-radius:var(--radius-md); padding:9px; cursor:pointer; }
  .panel .go:hover { background:var(--nox-yellow-strong); }
  .panel .ghost { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:var(--radius-sm); padding:6px; cursor:pointer; }
  .panel .ghost:hover { background:var(--surface-2); }
</style>
</head>
<body>
<div id="app" class="focus">
  <div id="bubble"></div>

  <div id="stage" title="Clique pour me parler, glisse-moi où tu veux" role="button" aria-label="Parler à la mascotte">
    <svg id="ring" viewBox="0 0 130 130"><circle class="track" cx="65" cy="65" r="60"/><circle class="bar" id="ringBar" cx="65" cy="65" r="60" stroke-dasharray="377" stroke-dashoffset="377"/></svg>
    <span id="timerLabel"></span>
    <span id="zz">z z</span>
    <svg id="mascot" viewBox="0 0 100 100"></svg>
    <img id="custom" src="assets/mascot.png" alt="" onerror="this.remove()" onload="document.getElementById('mascot').style.display='none'">
  </div>

  <div id="bar">
    <input id="input" placeholder="Dis-moi ce que tu dois faire…">
    <!-- Icones vectorielles au trait (2 px), heritent de la couleur du texte -->
    <button id="write" title="Écrire" aria-label="Écrire un message"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
    <button id="mic" title="Parler" aria-label="Parler"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    <button id="voice" title="Voix on/off" aria-label="Couper la voix"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave-on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="wave-off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    <button id="dashboard" title="Tableau de bord" aria-label="Ouvrir le tableau de bord"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
    <button id="settings" title="Réglages" aria-label="Réglages"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>

  <!-- Réglages -->
  <div class="panel" id="prefs">
    <h2>Réglages</h2>
    <label>Mode
      <select id="pMode"><option value="travail">Travail</option><option value="etudes">Études</option><option value="repos">Repos (je dors)</option><option value="off">Off</option></select></label>
    <label>Fermeté
      <select id="pFirm"><option value="douce">Tout doux</option><option value="normale">Normale</option><option value="stricte">Coach strict</option></select></label>
    <label><input type="checkbox" id="pWatch"> Voir l'appli / l'onglet actif</label>
    <button class="ghost" id="pDash">Ouvrir le tableau de bord</button>
    <button class="ghost" id="pOnboard">Refaire l'onboarding</button>
    <button class="ghost" id="pReset">Terminer la tâche en cours</button>
    <button class="ghost" id="pQuit">Quitter Nox</button>
    <button class="go" id="pSave">OK</button>
  </div>
</div>

<script src="mascot.js"></script>
<script src="realtime.js"></script>
<script src="renderer.js"></script>
</body>
</html>
